name: friday-mark-1
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: friday
      POSTGRES_DB: friday
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgresData:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friday -d friday"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgresData:
